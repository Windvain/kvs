[package]
name = "kvs"
version = "0.1.0"
authors = ["Windvain"]
description = "A key-value store in rust"
edition = "2024"

[lib]
test = false

[[bin]]
name = "kvs"
test = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "0.11.0"
predicates = "1.0.0"
tempfile = "3.0.7"
walkdir = "2.2.7"
